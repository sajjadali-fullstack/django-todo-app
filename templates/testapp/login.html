<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Django ToDo App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .auth-card {
            max-width: 450px;
            width: 100%;
            border: none;
            border-radius: 12px;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-lg auth-card p-4">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-success">Login</h2>
            <p class="text-muted">Welcome back! Please login to your account</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-semibold">{{ field.label }}</label>
                {{ field }}
            </div>
            {% endfor %}

            {% if form.non_field_errors %}
            <div class="alert alert-danger p-2 small">
                Invalid username or password!
            </div>
            {% endif %}

            <button type="submit" class="btn btn-success w-100 py-2 fw-bold mt-2">Login</button>
        </form>

        <div class="text-center mt-4">
            <p class="mb-0 text-muted">Don't have an account? <a href="{% url 'signup' %}"
                    class="text-success fw-semibold text-decoration-none">Sign Up</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
